<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple AI Agent - Hugging Face</title>

  <!-- ✅ CSS INSIDE SAME FILE -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app {
      background: #020617;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    h1 {
      text-align: center;
      margin-bottom: 16px;
    }

    .chat-box {
      background: #020617;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 12px;
      height: 350px;
      overflow-y: auto;
      margin-bottom: 12px;
    }

    .message {
      margin-bottom: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      max-width: 80%;
    }

    .message.user {
      background: #2563eb;
      margin-left: auto;
    }

    .message.bot {
      background: #111827;
      border: 1px solid #1f2937;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      gap: 8px;
    }

    #user-input {
      flex: 1;
      padding: 8px;
      border-radius: 999px;
      border: 1px solid #4b5563;
      background: #020617;
      color: #e5e7eb;
    }

    #user-input:focus {
      outline: none;
      border-color: #2563eb;
    }

    #send-btn {
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: #22c55e;
      color: #020617;
      font-weight: bold;
    }

    #send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .info {
      margin-top: 10px;
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- ✅ HTML -->
  <div class="app">
    <h1>Simple AI Agent</h1>

    <div class="chat-box" id="chat-box"></div>

    <div class="input-area">
      <input type="text" id="user-input" placeholder="Type your message..." />
      <button id="send-btn">Send</button>
    </div>

    <p class="info">Powered by Hugging Face distilgpt2</p>
  </div>

  <!-- ✅ JAVASCRIPT INSIDE SAME FILE -->
  <script>
    const HF_API_URL = "https://api-inference.huggingface.co/models/distilgpt2";

    // ⚠️ Replace with your real token ONLY for local testing
    const HF_API_TOKEN = "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";

    const chatBox = document.getElementById("chat-box");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    function addMessage(text, sender = "user") {
      const msg = document.createElement("div");
      msg.classList.add("message", sender);
      msg.textContent = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function callHuggingFaceAPI(prompt) {
      const response = await fetch(HF_API_URL, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${HF_API_TOKEN}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          inputs: prompt,
          parameters: {
            max_new_tokens: 50,
            temperature: 0.7
          }
        })
      });

      if (!response.ok) {
        throw new Error("API Error: " + response.status);
      }

      const data = await response.json();

      if (Array.isArray(data) && data[0].generated_text) {
        return data[0].generated_text.substring(prompt.length).trim();
      } else {
        return "No response from AI.";
      }
    }

    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      addMessage(text, "user");
      userInput.value = "";
      sendBtn.disabled = true;

      addMessage("Thinking...", "bot");
      const thinking = chatBox.lastChild;

      try {
        const reply = await callHuggingFaceAPI(text);
        thinking.textContent = reply;
      } catch (err) {
        thinking.textContent = "Error connecting to AI.";
        console.error(err);
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener("click", handleSend);

    userInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") handleSend();
    });
  </script>

</body>
</html>
